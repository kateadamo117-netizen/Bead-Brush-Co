<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bead & Brush Co</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f8f8f8}header{text-align:center;padding:20px;background:white}header img{width:100%;max-width:1200px;border-radius:20px}h1{color:#ff1493}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:20px;max-width:1400px;margin:auto}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12)}.card img{width:100%;height:280px;object-fit:cover}.content{padding:15px}.price{color:#ff1493;font-size:24px;font-weight:bold}.qty{width:70px;padding:8px}button{cursor:pointer;border:none;padding:10px 15px;border-radius:8px}.addBtn{background:#00a651;color:white;width:100%;margin-top:10px}.cart{background:white;max-width:1200px;margin:20px auto;padding:20px;border-radius:16px}.cartRow{margin-bottom:10px}.cartBtn{margin:4px}.emailBtn{background:#00a651;color:white}.copyBtn{background:#0078d4;color:white}.printBtn{background:#ff9800;color:white}input,textarea{width:100%;padding:10px;margin-top:10px;box-sizing:border-box}.total{font-size:28px;color:#ff1493;font-weight:bold}@media(max-width:768px){.products{grid-template-columns:repeat(2,1fr)}.card img{height:180px}}</style></head><body><header><img src="images/banner.png" alt="Banner"><h1>Bead & Brush Co</h1><p>Creative craft kits and gifts.</p></header><div class="products" id="products"></div><div class="cart"><h2>Your Order</h2><div id="cartItems">No items added yet.</div><div class="total">$<span id="total">0</span></div><input id="customerName" placeholder="Customer Name"><input id="customerEmail" placeholder="Customer Email"><input id="customerPhone" placeholder="Phone Number"><textarea id="notes" placeholder="Notes"></textarea><br><br><button class="emailBtn cartBtn" onclick="emailOrder()">Email Order</button><button class="copyBtn cartBtn" onclick="copyOrder()">Copy Order</button><button class="printBtn cartBtn" onclick="window.print()">Print Order</button></div><script>const products=[{name:'STEM Card Kit',price:10,image:'images/stem-card-placeholder.png'},{name:'Plaster & Paint Kit',price:10,image:'images/plaster-kit-placeholder.png'},{name:'Wooden Shapes Kit',price:11,image:'images/wooden-decorations.png'},{name:'Draw & Paint Canvas',price:8,image:'images/draw-paint-canvas.png'},{name:'Christmas Canvas',price:8,image:'images/christmas-canvas.png'},{name:'Glass Bead Bracelet',price:10,image:'images/glass-bracelet.png'},{name:'Seed Bead Bracelet',price:2,image:'images/seed-bracelet.png'},{name:'Seed Bead Bracelet Premium',price:5,image:'images/seed-bracelet.png'},{name:'Bag Charms',price:10,image:'images/bag-charms-placeholder.png'},{name:'Kids Keyrings',price:5,image:'images/kids-keyrings.png'},{name:'Make Your Own Bracelet',price:2,image:'images/make-bracelet.png'}];let cart=[];const pd=document.getElementById('products');products.forEach((p,i)=>{pd.innerHTML+=`<div class="card"><img src="${p.image}"><div class="content"><h3>${p.name}</h3><div class="price">$${p.price}</div><input type="number" id="qty${i}" class="qty" value="1" min="1"><button class="addBtn" onclick="addToCart(${i})">Add To Cart</button></div></div>`});function addToCart(i){const qty=parseInt(document.getElementById('qty'+i).value);cart.push({name:products[i].name,price:products[i].price,qty});renderCart()}function renderCart(){let total=0,html='';cart.forEach(item=>{const line=item.price*item.qty;total+=line;html+=`<div class='cartRow'>${item.qty} x ${item.name} = $${line}</div>`});cartItems.innerHTML=html||'No items added yet.';document.getElementById('total').innerText=total}function buildOrder(){let total=0;let out=`Customer: ${customerName.value}
Email: ${customerEmail.value}
Phone: ${customerPhone.value}

`;cart.forEach(item=>{const line=item.price*item.qty;total+=line;out+=`${item.qty} x ${item.name} = $${line}
`});out+=`
TOTAL $${total}

NOTES
${notes.value}`;return out}function copyOrder(){navigator.clipboard.writeText(buildOrder());alert('Order copied')}function emailOrder(){location.href='mailto:stem@smartlivinghome.com.au?subject=Bead%20and%20Brush%20Order&body='+encodeURIComponent(buildOrder())}</script></body></html>
